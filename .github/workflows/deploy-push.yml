
name: WikiVerse - Déployer notifications

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer la fonction
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: vzicucmeehoqxndavlps
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Secret SUPABASE_ACCESS_TOKEN manquant'; exit 1; }
          supabase functions deploy notify-friend-request --project-ref "$PROJECT_REF" --no-verify-jwt
