
name: WikiVerse - Catalogue 30000

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer les statistiques existantes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api \
            "repos/$GH_REPO/actions/artifacts?name=wikiverse-statistiques-30jours&per_page=100" \
            > artifacts.json

          python - <<'PY'
          import json
          items=json.load(open("artifacts.json"))["artifacts"]
          items=[x for x in items if not x["expired"]]
          if not items:
              raise SystemExit("Archive statistiques introuvable")
          items.sort(key=lambda x:x["created_at"],reverse=True)
          open("artifact_id.txt","w").write(str(items[0]["id"]))
          PY

          ID=$(cat artifact_id.txt)
          gh api \
            "repos/$GH_REPO/actions/artifacts/$ID/zip" \
            > stats.zip
          unzip -o stats.zip

      - name: Telecharger le catalogue Wikimedia
        run: |
          curl -fL \
            --retry 5 \
            --retry-delay 15 \
            --connect-timeout 30 \
            "https://dumps.wikimedia.org/frwiki/latest/frwiki-latest-page.sql.gz" \
            -o frwiki-page.sql.gz

          ls -lh frwiki-page.sql.gz

      - name: Construire les 30000 cartes
        run: |
          cat > build.py <<'PY'
          import csv
          import gzip
          import heapq
          import random
          import re

          TARGET=30000
          random.seed(20261122)

          top=[]
          sample=[]
          count=0

          print("Lecture des statistiques...",flush=True)

          with gzip.open(
              "wikiverse-views-30d.csv.gz",
              "rt",encoding="utf-8"
          ) as f:
              for row in csv.DictReader(f):
                  try:
                      pid=int(row["page_id"])
                      views=int(row["views_30d"])
                  except (ValueError,KeyError):
                      continue

                  if pid<=0:
                      continue

                  item=(pid,views)
                  count+=1

                  if len(top)<10000:
                      heapq.heappush(top,(views,pid))
                  elif (views,pid)>top[0]:
                      heapq.heapreplace(top,(views,pid))

                  if len(sample)<180000:
                      sample.append(item)
                  else:
                      j=random.randrange(count)
                      if j<len(sample):
                          sample[j]=item

          candidates={pid:views for pid,views in sample}

          for views,pid in top:
              candidates[pid]=views

          print(
              "Candidats :",len(candidates),
              flush=True
          )

          # Lire les INSERT du dump page.sql Wikimedia.
          # Seules les pages de l'espace principal (ns=0)
          # seront retenues.
          pattern=re.compile(
              rb"\((\d+),0,'((?:\\.|[^'\\])*)',"
          )

          def decode_title(raw):
              out=bytearray()
              i=0
              while i<len(raw):
                  if raw[i]==92 and i+1<len(raw):
                      c=raw[i+1]
                      mapping={
                          48:0,98:8,110:10,114:13,
                          116:9,90:26
                      }
                      out.append(mapping.get(c,c))
                      i+=2
                  else:
                      out.append(raw[i])
                      i+=1
              return out.decode("utf-8","replace").replace("_"," ")

          found={}
          scanned=0

          print("Lecture du dump Wikimedia...",flush=True)

          with gzip.open("frwiki-page.sql.gz","rb") as f:
              for line in f:
                  if not line.startswith(b"INSERT INTO"):
                      continue

                  for match in pattern.finditer(line):
                      scanned+=1
                      pid=int(match.group(1))

                      if pid not in candidates:
                          continue

                      title=decode_title(match.group(2)).strip()

                      if title and "\ufffd" not in title:
                          found[pid]=(
                              title,candidates[pid]
                          )

                  if scanned and scanned%1000000<100:
                      print(
                          "Pages examinees :",scanned,
                          "| Correspondances :",len(found),
                          flush=True
                      )

          print(
              "Correspondances totales :",len(found),
              flush=True
          )

          if len(found)<TARGET:
              raise SystemExit(
                  "Moins de 30000 pages trouvees : "
                  "aucun fichier incomplet publie."
              )

          # Inclure les pages populaires puis completer
          # avec une selection diversifiee.
          popular_ids={
              pid for views,pid in top
              if pid in found
          }

          popular=sorted(
              popular_ids,
              key=lambda pid:found[pid][1],
              reverse=True
          )[:8000]

          remaining=[
              pid for pid in found
              if pid not in set(popular)
          ]
          random.shuffle(remaining)

          chosen=popular+remaining[:TARGET-len(popular)]
          random.shuffle(chosen)

          with open(
              "wikiverse-catalogue-30000.csv",
              "w",newline="",encoding="utf-8"
          ) as f:
              writer=csv.writer(f)
              writer.writerow([
                  "page_id","title","views_30d"
              ])
              for pid in chosen:
                  title,views=found[pid]
                  writer.writerow([pid,title,views])

          print(
              "SUCCES : 30000 cartes exportees",
              flush=True
          )
          PY

          python -u build.py

      - name: Publier le catalogue
        uses: actions/upload-artifact@v4
        with:
          name: wikiverse-catalogue-30000
          path: wikiverse-catalogue-30000.csv
          retention-days: 30
