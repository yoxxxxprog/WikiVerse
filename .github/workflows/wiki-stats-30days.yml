
name: WikiVerse - Statistiques 30 jours

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparation:
    runs-on: ubuntu-latest
    outputs:
      dates: ${{ steps.dates.outputs.dates }}
    steps:
      - name: Calculer les 30 dates
        id: dates
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          end = datetime.now(timezone.utc).date() - timedelta(days=3)

          dates = [
              (end - timedelta(days=i)).isoformat()
              for i in range(29, -1, -1)
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("dates=" + json.dumps(dates) + "\n")

          print("PERIODE :", dates[0], dates[-1])
          PY

  extraction:
    needs: preparation
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        date: ${{ fromJSON(needs.preparation.outputs.dates) }}

    steps:
      - name: Extraire les statistiques françaises
        env:
          DATE: ${{ matrix.date }}
        run: |
          python - <<'PY'
          import os
          import bz2
          import gzip
          import urllib.request
          from collections import Counter
          from datetime import date

          day = date.fromisoformat(os.environ["DATE"])
          filename = f"pageviews-{day:%Y%m%d}-user.bz2"

          url = (
              "https://dumps.wikimedia.org/other/pageview_complete/"
              f"{day:%Y}/{day:%Y-%m}/{filename}"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "WikiVerse/2.0 (https://github.com/yoxxxxprog/WikiVerse)"
              }
          )

          counts = Counter()

          print("TELECHARGEMENT :", url, flush=True)

          with urllib.request.urlopen(request, timeout=180) as response:
              with bz2.BZ2File(response) as archive:
                  for raw in archive:
                      if not raw.startswith(b"fr.wikipedia "):
                          continue

                      parts = raw.split()

                      if len(parts) < 5:
                          continue

                      if not parts[2].isdigit():
                          continue

                      if not parts[4].isdigit():
                          continue

                      page_id = int(parts[2])
                      views = int(parts[4])

                      counts[page_id] += views

          if not counts:
              raise RuntimeError("Aucune statistique extraite")

          os.makedirs("results", exist_ok=True)

          with gzip.open(
              f"results/{day}.csv.gz", "wt"
          ) as output:
              for page_id, views in counts.items():
                  output.write(f"{page_id},{views}\n")

          print("DATE :", day)
          print("PAGES FRANCAISES :", len(counts))
          print("CONSULTATIONS :", sum(counts.values()))
          print("EXTRACTION REUSSIE")
          PY

      - name: Sauvegarder la journée
        uses: actions/upload-artifact@v4
        with:
          name: stats-${{ matrix.date }}
          path: results/
          retention-days: 7

  fusion:
    needs: extraction
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les 30 journées
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          path: daily/
          merge-multiple: true

      - name: Fusionner les statistiques
        run: |
          python - <<'PY'
          import gzip
          import csv
          import glob
          from collections import Counter

          files = sorted(glob.glob("daily/*.csv.gz"))

          if len(files) != 30:
              raise RuntimeError(
                  f"30 fichiers attendus, {len(files)} recus"
              )

          totals = Counter()

          for filename in files:
              print("FUSION :", filename)

              with gzip.open(filename, "rt") as f:
                  for page_id, views in csv.reader(f):
                      totals[int(page_id)] += int(views)

          with gzip.open(
              "wikiverse-views-30d.csv.gz", "wt"
          ) as f:
              writer = csv.writer(f)
              writer.writerow(["page_id", "views_30d"])
              writer.writerows(totals.items())

          print("JOURNEES :", len(files))
          print("PAGES UNIQUES :", len(totals))
          print("CONSULTATIONS :", sum(totals.values()))

          print("TOP 20 :")

          for page_id, views in totals.most_common(20):
              print(page_id, views)

          print("FUSION TERMINEE")
          PY

      - name: Sauvegarder les statistiques finales
        uses: actions/upload-artifact@v4
        with:
          name: wikiverse-statistiques-30jours
          path: wikiverse-views-30d.csv.gz
          retention-days: 7
