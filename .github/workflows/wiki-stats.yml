name: WikiVerse - Statistiques

on:
  workflow_dispatch:

jobs:
  statistiques:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Extraire les consultations françaises
        run: |
          python - <<'PY'
          import urllib.request
          import bz2
          from collections import Counter

          url = "https://dumps.wikimedia.org/other/pageview_complete/2026/2026-11/pageviews-20261119-user.bz2"

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "WikiVerse/2.0 (https://github.com/yoxxxxprog/WikiVerse)"
              }
          )

          views = Counter()

          with urllib.request.urlopen(req, timeout=120) as response:
              with bz2.BZ2File(response) as archive:
                  for line in archive:
                      parts = line.split()

                      if len(parts) != 6:
                          continue

                      if parts[0] != b"fr.wikipedia":
                          continue

                      if not parts[2].isdigit():
                          continue

                      if not parts[4].isdigit():
                          continue

                      page_id = int(parts[2])
                      views[page_id] += int(parts[4])

          print("ARTICLES FRANCAIS :", len(views))
          print("CONSULTATIONS :", sum(views.values()))

          print("TOP 20 :")
          for page_id, count in views.most_common(20):
              print(page_id, count)

          if not views:
              raise RuntimeError("Aucune statistique francaise trouvee")

          print("EXTRACTION REUSSIE")
          PY
