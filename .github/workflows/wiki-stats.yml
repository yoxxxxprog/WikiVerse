name: WikiVerse - Statistiques

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistiques:
    runs-on: ubuntu-latest

    steps:
      - name: Identifier les fichiers Wikimedia
        run: |
          python - <<'PY'
          import urllib.request
          import re
          from datetime import datetime, timedelta, timezone

          base = "https://dumps.wikimedia.org/other/pageview_complete/"
          end = datetime.now(timezone.utc).date() - timedelta(days=3)
          start = end - timedelta(days=29)

          print("Periode :", start, "au", end)

          months = sorted({
              (start + timedelta(days=i)).strftime("%Y/%Y-%m")
              for i in range(30)
          })

          for month in months:
              url = base + month + "/"
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "WikiVerse/2.0 (https://github.com/yoxxxxprog/WikiVerse)"}
              )

              with urllib.request.urlopen(req, timeout=60) as r:
                  html = r.read().decode()

              print("DOSSIER :", url)

              for file in sorted(set(re.findall(r'href="([^"]+)"', html))):
                  if file.endswith(".gz"):
                      print(file)
          PY
